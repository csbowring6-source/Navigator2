<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Navigator — Somewhere to stay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Look: warm off-white, dark text, green actions, orange-brown for free camps + warnings ── */
  :root{
    color-scheme:light dark;   /* STAYTIDY: we supply both palettes — Chrome must not auto-darken the page itself */
    --bg:#F4F1EA; --ink:#1B1F1D; --green:#1E6B47; --brown:#9A4A00; --card:#FFFFFF;
    --muted:#4A514D; --line:#1B1F1D; --grey:#C9C6BE; --brown-text:#9A4A00;
  }
  /* Dark mode: dark background, light text, the SAME green for selected + Call buttons. */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141715; --ink:#F1EFE8; --card:#1F2421; --muted:#B4B9B3; --line:#DCD9D0; --grey:#3A3F3C; --brown:#B85A0A; --brown-text:#E39A5A;
    }
    button:disabled,.btn.off{color:#8E948F}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* SMALLER: the phone browser must not enlarge text on its own */
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;font-size:19px;line-height:1.35}
  body{padding:16px 16px 40px;max-width:600px;margin:0 auto}   /* NEWTRIP: full phone width, 16 px margins, capped at 600 px on big screens */
  h1,h2,h3{font-family:'Barlow Semi Condensed',sans-serif;font-weight:700;margin:0 0 10px;line-height:1.1}
  h1{font-size:34px} h2{font-size:28px} h3{font-size:24px}
  /* STAYLIST: the Stay screen is COMPACT — body 16 px, small heading, tight padding — so the
     choice buttons and the first three rows fit one phone screen. */
  #s3{font-size:16px} #s3 h1{font-size:26px;margin:0 0 8px} #s3 .link{font-size:16px;min-height:36px;padding:4px 0}
  p{margin:0 0 12px}
  .screen{display:none} .screen.on{display:block}
  .top{font-size:20px;color:var(--muted);margin-bottom:18px}
  label{display:block;font-weight:600;margin:16px 0 6px}
  input[type=text]{width:100%;min-height:64px;font:inherit;font-size:20px;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  #goBtn{min-height:60px;font-size:22px;margin:8px 0 0}
  /* Screen 1 compact (CONFIRMFIT): one-line 30 px heading, tight spacing, so boxes (or the confirm card) AND the first recent trip fit 390×844. */
  /* SMALLER: screen 1 ~20% smaller throughout; the heading ALWAYS one line, shrinking with the screen. */
  #s1{font-size:16px}
  #s1 .top{font-size:15px;margin-bottom:6px} #s1 h1{font-size:min(26px,6.5vw);margin:0 0 4px;white-space:nowrap;overflow:hidden}
  #s1 label{font-size:16px;margin:6px 0 3px}
  #s1 input[type=text]{min-height:56px;font-size:18px;padding:10px 12px}
  #s1 .trips h3{margin:12px 0 4px;font-size:18px} #s1 .trips button{min-height:48px;font-size:16px;padding:8px 14px;margin:5px 0}
  #confirm .card{padding:10px 12px;margin:2px 0 0}
  #confirm .nmc{font-weight:700;font-size:21px;line-height:1.15} #confirm .stopc{margin:3px 0 0;font-size:16px}
  #yesBtn{min-height:56px;font-size:19px;margin:8px 0 6px} #againBtn{min-height:48px;font-size:17px;background:var(--card);border:2px solid var(--line);margin:0}
  /* Main screen (NEWTRIP): the two job buttons are big enough to hit at a glance; "New trip" is a plain bordered button. */
  .job{min-height:72px;font-size:20px}
  #newTripBtn{background:var(--card);border:2px solid var(--line);min-height:48px;font-size:18px;margin:0 0 14px}
  input[type=text]:focus{outline:3px solid var(--green);outline-offset:1px}
  button,.btn{display:block;width:100%;min-height:56px;font:inherit;font-size:21px;font-weight:700;padding:12px 16px;border-radius:12px;border:2px solid var(--line);
    background:var(--card);color:var(--ink);cursor:pointer;text-align:center;text-decoration:none;margin:10px 0}
  .primary{background:var(--green);color:#fff;border-color:var(--green)}
  .brown{background:var(--brown);color:#fff;border-color:var(--brown)}
  .ghost{background:transparent}
  .link{background:none;border:none;color:var(--green);text-decoration:underline;font-size:19px;min-height:44px;width:auto;display:inline-block;padding:8px 0;margin:0}
  button:disabled,.btn.off{background:var(--grey);color:#5c5c5c;border-color:var(--grey);cursor:default}
  .row{display:flex;gap:10px} .row>*{flex:1}
  /* Choice buttons: 44 px, smaller text. Unselected = plain, thin border, normal weight; selected = solid green, white bold. No ticks. */
  .seg{gap:6px;margin-bottom:6px} .seg button{margin:0;min-height:44px;font-size:16px;font-weight:400;border-width:1px;border-radius:9px;padding:8px 6px}
  .seg button.sel{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
  .seg.when{flex-wrap:wrap} .seg.when button{flex:1 1 45%}   /* 2×2 so "At Rockhampton" never truncates */
  .panel{background:var(--green);color:#fff;border-radius:14px;padding:18px;margin-bottom:12px}
  .panel{padding:14px 16px} .panel h2{color:#fff;font-size:22px;margin-bottom:4px} .panel .big{font-size:18px;font-weight:700} .panel #stopLine{font-size:15px;margin-top:3px}
  .card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
  /* Compact result rows (STAYLIST): text left, a square green phone button right; the ROW is the map handover. */
  .rows{margin-top:8px}
  .rowi{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;margin:6px 0;cursor:pointer}
  .rowi.free{border-color:var(--brown)} .rowi.free .nm,.rowi.free .ln2{color:var(--brown-text)}
  .rowi .txt{flex:1;min-width:0}
  .nm{font-weight:700;font-size:18px;line-height:1.2;overflow-wrap:anywhere}   /* long names wrap — never "…" */
  .ln2{font-size:15px;color:var(--ink);margin-top:2px;line-height:1.3}
  .fac{font-size:13px;color:var(--muted);margin-top:2px}
  .called{color:var(--muted);font-size:13px;font-weight:600;margin-top:2px}
  .nonum{color:var(--muted);font-size:13px;margin-top:2px}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--brown);color:#fff;margin-left:6px;vertical-align:middle}
  .ph{flex:0 0 56px;width:56px;height:56px;min-height:56px;margin:0;padding:0;border-radius:10px;background:var(--green);border-color:var(--green);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center}
  .ph.off{background:var(--grey);border-color:var(--grey)}
  .slim{min-height:44px;font-size:16px;padding:8px 12px;margin:8px 0}
  /* MAP view (Stay screen): replaces the list in the same space; pins are numbered like the rows. */
  #mapWrap{display:none;position:relative;height:50vh;min-height:300px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);margin-top:8px}
  #map{height:100%;width:100%;background:#E8E4DA}
  #mapMsg{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:16px;text-align:center;font-weight:600;color:var(--muted);background:var(--card)}
  #mapMsg.on{display:flex}
  .pin{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;font-family:'Public Sans',sans-serif}
  .pin.park{background:var(--green)} .pin.free{background:#9A4A00}
  .pin.here{width:18px;height:18px;background:#1E88E5;border:3px solid #fff}
  .pin.dest{width:16px;height:16px;background:var(--ink);border-radius:3px;border:2px solid #fff}
  .leaflet-tooltip.dest-name{font:600 13px 'Public Sans',sans-serif}
  #pinRow{margin-top:6px}
  #s3.mapmode #results{display:none} #s3.mapmode #mapWrap{display:block}
  .notice{border:2px solid var(--brown);color:var(--brown-text);background:var(--card);border-radius:10px;padding:10px 12px;font-weight:600;font-size:15px;margin:6px 0 8px}
  .quiet{color:var(--muted);font-size:16px}
  .stamp{color:var(--muted);font-size:14px;text-align:center;margin-top:30px}
  .trips button{text-align:left}
</style>
</head>
<body>

<!-- ═══ SCREEN 1: WHERE ARE YOU HEADING ═══ -->
<section id="s1" class="screen">
  <div class="top" id="youAreAt">Finding where you are…</div>
  <div id="posHelp1"></div>
  <h1>Where are you heading?</h1>
  <!-- CONFIRMFIT: the text boxes + Go and the confirm card take TURNS in the same spot under the heading, so the whole card is always on screen. -->
  <div id="entry">
    <label for="dest">Destination</label>
    <input type="text" id="dest" placeholder="Town, e.g. Yalboroo" autocomplete="off" enterkeyhint="go">
    <label for="stop">Stopping on the way? (optional)</label>
    <input type="text" id="stop" placeholder="Town" autocomplete="off" enterkeyhint="go">
    <button class="primary" id="goBtn">Go</button>
  </div>
  <div id="confirm"></div>
  <div class="trips" id="recent"></div>
</section>

<!-- ═══ SCREEN 2: MAIN ═══ -->
<section id="s2" class="screen">
  <div class="panel">
    <h2 id="heading">Heading to …</h2>
    <div class="big" id="routeLine">Working out the route…</div>
    <div id="stopLine"></div>
    <div id="posHelp2"></div>
  </div>
  <button id="newTripBtn">New trip</button>
  <button class="primary job" id="stayBtn">Somewhere to stay</button>
  <button class="btn off job" disabled>Fuel — Coming next</button>
  <div class="stamp" id="stamp"></div>
</section>

<!-- ═══ SCREEN 3: SOMEWHERE TO STAY ═══ -->
<section id="s3" class="screen">
  <button class="link" id="backBtn">‹ Back</button>
  <h1>Somewhere to stay</h1>
  <div class="row seg when" id="segWhen"><button data-v="soon" class="sel">Soon</button><button data-v="1">Within 1 hr</button><button data-v="2">Within 2 hrs</button><button data-v="stop" id="atStopBtn">At …</button></div>
  <div class="row seg" id="segKind"><button data-v="both" class="sel">Both</button><button data-v="paid">Paid</button><button data-v="free">Free</button></div>
  <div id="stayNotice"></div>
  <div class="row seg" id="segView"><button data-v="list" class="sel">List</button><button data-v="map">Map</button></div>
  <!-- MAP: for choosing, not navigating. Same results as the list; the driver's own map app does the driving. -->
  <div id="mapWrap"><div id="map"></div><div id="mapMsg"></div></div>
  <div id="pinRow"></div>
  <div id="results"></div>
</section>

<script>
'use strict';
const BUILD = 'new v 29 Sep 2026, 01:22 PM AEST';
const API_URL = 'https://delicate-credit-a17e.csbowring6.workers.dev/';
const $ = (id) => document.getElementById(id);
const STATE_ABBR = { 'Queensland':'QLD', 'New South Wales':'NSW', 'Victoria':'VIC', 'South Australia':'SA', 'Western Australia':'WA',
                     'Tasmania':'TAS', 'Northern Territory':'NT', 'Australian Capital Territory':'ACT' };

// ── Storage (all on the phone) ─────────────────────────────────────────────────
const store = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
let trip  = store.get('nav2_trip', null);      // { dest:{name,lat,lng}, stop:{name,lat,lng}|null }
let round = store.get('nav2_round', null);     // { sites:[...], calls:{name: time}, target, params } — the list shown, and who's been rung
let lastShown = null;                          // what screen 3 is currently showing, so a call return can re-draw it without a search
let pos   = null;                              // { lat, lng }
let posLabel = '';

// ── Durations: ALWAYS hours-and-minutes (ported from the old app's hrsMins) ────
function hrsMins(totalMins) {
  const t = Math.max(0, Math.round(totalMins));
  if (t < 60) return `${t} min`;
  const h = Math.floor(t / 60), m = t % 60;
  return m ? `${h} hr ${String(m).padStart(2, '0')}` : `${h} hr`;
}
function timeLabel(ts) { return new Date(ts).toLocaleTimeString('en-AU', { hour: 'numeric', minute: '2-digit' }); }

// ── Worker calls (ported from the old app's geoFetch / revGeoFetch: 'failed' ≠ 'empty') ──
async function api(path, params, timeoutMs) {
  const q = Object.entries(params).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
  const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), timeoutMs || 15000);
  try {
    const r = await fetch(`${API_URL}${path}?${q}`, { signal: ctrl.signal });
    clearTimeout(to);
    const j = await r.json().catch(() => null);
    return { ok: r.ok, status: r.status, data: j };
  } catch (e) { clearTimeout(to); return { ok: false, status: 0, data: null, offline: !navigator.onLine || true }; }
}
async function geocode(q) {
  const r = await api('geocode', { q: `${q}, Australia`, addr: 1 });
  if (!r.ok || !r.data || !Array.isArray(r.data.data)) return { status: 'failed' };
  if (!r.data.data.length) return { status: 'empty' };
  const h = r.data.data[0], a = h.address || {};
  const town = a.town || a.city || a.village || a.hamlet || a.suburb || a.municipality || a.county || (h.display_name || '').split(',')[0].trim() || q;
  const st = STATE_ABBR[a.state] || a.state || '';
  return { status: 'ok', place: { name: st ? `${town}, ${st}` : town, lat: +h.lat, lng: +h.lon } };
}
async function reverseGeocode(lat, lng) {
  const r = await api('reverse-geocode', { lat, lon: lng });   // default zoom — a coarser zoom drops small places (Boyland is a city_district)
  const a = r.ok && r.data && r.data.data && r.data.data.address;
  if (!a) return '';
  const town = a.town || a.village || a.suburb || a.city_district || a.locality || a.city || a.hamlet || a.municipality || a.county || '';
  const st = STATE_ABBR[a.state] || a.state || '';
  return town ? (st ? `${town}, ${st}` : town) : '';
}

// ── Map-app handover (ported from the old app's openInMap: coordinates, never a name search) ──
function mapUrl(lat, lng) {
  const iOS = /iPhone|iPad|iPod/i.test(navigator.userAgent), android = /Android/i.test(navigator.userAgent);
  if (iOS) return `https://maps.apple.com/?daddr=${lat},${lng}&dirflg=d`;
  if (android) return `google.navigation:q=${lat},${lng}`;
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
}
function takeMeThere(lat, lng) { window.location.href = mapUrl(lat, lng); }

// ── Screens ────────────────────────────────────────────────────────────────────
function show(id) { document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }
function target() { return trip && (trip.stop || trip.dest); }   // a set stop is searched towards first

// ── Position: ?at=LAT,LNG for laptop testing, otherwise GPS ────────────────────
// NEWTRIP (GPS): the SAME ask as the old app's initGPS — getCurrentPosition with high
// accuracy, a 15 s timeout, no cached fix, retried up to four times (3 s apart) on a
// timeout / no-fix error, plus a watchPosition that keeps `pos` fresh. The old app's
// browser permission prompt is the browser's own — nothing extra is needed here either.
// Two things the first version got wrong: it never redrew the main screen when the fix
// arrived AFTER boot (so "Waiting for your GPS position…" stayed forever on a real
// phone), and it never gave up. Now every fix goes through onFix(), and a 15 s guard
// replaces the waiting line with plain words and a Try again button.
let gpsRetries = 0, posGuard = null, posFailed = false;
const NO_POS_MSG = "Can't get your position. Check location is switched on for this browser.";
function testPosition() {   // ?at=LAT,LNG — read from the CURRENT address only, never saved, never reused without it
  const at = new URLSearchParams(location.search).get('at');
  if (!at || !/^-?\d+(\.\d+)?,-?\d+(\.\d+)?$/.test(at)) return null;
  const [lat, lng] = at.split(',').map(Number); return { lat, lng };
}
function onFix(lat, lng) {
  const first = !pos;
  pos = { lat, lng }; posFailed = false;
  clearTimeout(posGuard); posGuard = null;
  if (first) { labelPosition(); if (trip && document.querySelector('#s2.on')) openMain(); }   // the main screen was waiting on this
}
function showNoPosition() {
  posFailed = true;
  const help = (id) => { const el = $(id); if (!el) return; el.innerHTML = ''; const b = document.createElement('button'); b.textContent = 'Try again'; b.style.marginTop = '8px'; b.onclick = () => initPosition(true); el.appendChild(b); };
  $('youAreAt').textContent = NO_POS_MSG; help('posHelp1');
  if (trip) { $('routeLine').textContent = NO_POS_MSG; $('routeLine').style.fontSize = '17px'; help('posHelp2'); }
}
function initPosition(retry) {
  const t = testPosition();
  if (t) { posLabel = 'test position'; onFix(t.lat, t.lng); return; }
  if (!navigator.geolocation) { $('youAreAt').textContent = 'No GPS on this device.'; return; }
  if (retry) { gpsRetries = 0; posFailed = false; $('youAreAt').textContent = 'Finding where you are…'; ['posHelp1', 'posHelp2'].forEach((id) => { if ($(id)) $(id).innerHTML = ''; }); if (trip) { $('routeLine').textContent = 'Waiting for your GPS position…'; $('routeLine').style.fontSize = ''; } }
  // Never leave the driver waiting: 15 s with no fix → plain words + Try again.
  clearTimeout(posGuard); posGuard = setTimeout(() => { if (!pos) showNoPosition(); }, 15000);
  navigator.geolocation.getCurrentPosition(
    (p) => { gpsRetries = 0; onFix(p.coords.latitude, p.coords.longitude); },
    (e) => {
      if (e.code === 1) { clearTimeout(posGuard); showNoPosition(); return; }        // blocked — retrying won't help
      if (gpsRetries < 4) { gpsRetries++; setTimeout(() => initPosition(false), 3000); }   // timeout / no fix: transient, retry like the old app
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  if (!retry && !initPosition.watching) {
    initPosition.watching = true;
    navigator.geolocation.watchPosition((p) => onFix(p.coords.latitude, p.coords.longitude), () => {}, { enableHighAccuracy: true, maximumAge: 15000 });
  }
}
async function labelPosition() {
  $('youAreAt').textContent = 'You are near…';
  const t = await reverseGeocode(pos.lat, pos.lng);
  posLabel = t || `${pos.lat.toFixed(2)}, ${pos.lng.toFixed(2)}`;
  $('youAreAt').textContent = `You are at ${posLabel}`;
}

// ── SCREEN 1 ───────────────────────────────────────────────────────────────────
function renderRecent() {
  const trips = store.get('nav2_trips', []);
  $('recent').innerHTML = trips.length ? '<h3 style="margin-top:22px">Recent trips</h3>' : '';
  trips.slice(0, 3).forEach((t) => {
    const b = document.createElement('button');
    b.textContent = t.stop ? `${t.dest.name} — via ${t.stop.name}` : t.dest.name;
    b.onclick = () => commitTrip(t.dest, t.stop);
    $('recent').appendChild(b);
  });
}
function showEntry() { $('confirm').innerHTML = ''; $('entry').style.display = ''; }
async function onGo() {
  const d = $('dest').value.trim(), s = $('stop').value.trim();
  const box = $('confirm'); box.innerHTML = '';
  if (!d) { box.innerHTML = '<p class="notice">Type the town you are heading to.</p>'; return; }
  $('goBtn').disabled = true; $('goBtn').textContent = 'Looking it up…';
  const gd = await geocode(d);
  const gs = s ? await geocode(s) : { status: 'none' };
  $('goBtn').disabled = false; $('goBtn').textContent = 'Go';
  const fail = (what, g) => g.status === 'failed' ? `Couldn't look up ${what} just now — give it a moment and try again.`
             : g.status === 'empty' ? `Couldn't find "${what}" on the map — try the town plus its state, e.g. "Yalboroo QLD".` : '';
  const msg = fail(d, gd) || (s ? fail(s, gs) : '');
  if (msg) { box.innerHTML = `<p class="notice">${esc(msg)}</p>`; return; }
  // Never go ahead on a match the driver hasn't confirmed.
  // The card takes the boxes' place (never below them, where it ran off the screen).
  box.innerHTML = `<div class="card"><div class="nmc">${esc(gd.place.name)}</div>${s ? `<div class="stopc">Stopping at <b>${esc(gs.place.name)}</b></div>` : ''}
    <button class="primary" id="yesBtn">Yes, that's it</button><button id="againBtn">Try again</button></div>`;
  $('entry').style.display = 'none';
  $('yesBtn').onclick = () => commitTrip(gd.place, s ? gs.place : null);
  $('againBtn').onclick = () => { showEntry(); $('dest').focus(); };   // boxes come back with the typed words still in them
}
function commitTrip(dest, stop) {
  trip = { dest, stop: stop || null, ts: Date.now() };
  store.set('nav2_trip', trip);
  const others = store.get('nav2_trips', []).filter((t) => t.dest.name !== dest.name || (t.stop && t.stop.name) !== (stop && stop.name));
  store.set('nav2_trips', [trip, ...others].slice(0, 3));
  round = null; store.del('nav2_round');
  showEntry();   // screen 1 is left ready for next time (boxes showing, no stale card)
  openMain();
}

// ── SCREEN 2 ───────────────────────────────────────────────────────────────────
async function openMain() {
  show('s2');
  $('heading').textContent = `Heading to ${trip.dest.name}`;
  $('stopLine').textContent = trip.stop ? `Stopping at ${trip.stop.name}` : '';
  $('routeLine').textContent = 'Working out the route…'; $('routeLine').style.fontSize = ''; $('posHelp2').innerHTML = '';
  if (!pos) { if (posFailed) showNoPosition(); else $('routeLine').textContent = 'Waiting for your GPS position…'; return; }   // onFix() redraws this screen when the fix lands
  const r = await api('route', { lat: pos.lat, lng: pos.lng, dlat: trip.dest.lat, dlng: trip.dest.lng }, 12000);
  if (r.ok && r.data && r.data.km != null) { $('routeLine').textContent = `${r.data.drive_time} · ${r.data.km} km left`; if (Array.isArray(r.data.line)) routeLines[trip.dest.name] = r.data.line; }
  else $('routeLine').textContent = navigator.onLine ? "Couldn't get the route just now." : 'No signal — distance unavailable.';
  if (trip.stop) {
    const rs = await api('route', { lat: pos.lat, lng: pos.lng, dlat: trip.stop.lat, dlng: trip.stop.lng }, 12000);
    if (rs.ok && rs.data && rs.data.km != null) { $('stopLine').textContent = `Stopping at ${trip.stop.name} — ${rs.data.drive_time} · ${rs.data.km} km`; if (Array.isArray(rs.data.line)) routeLines[trip.stop.name] = rs.data.line; }
  }
}

// ── SCREEN 3 ───────────────────────────────────────────────────────────────────
let when = 'soon', kind = 'both';   // WHEN to stop: soon · 1 · 2 (hours ahead) · stop (at the planned stop / destination)
function shortName(p) { return (p && p.name || '').split(',')[0].trim(); }
function labelAtStop() { const t = target(); $('atStopBtn').textContent = t ? `At ${shortName(t)}` : 'At stop'; }
// STAYTIDY: a tap on any choice button searches straight away — there is no separate Search
// button, so the cards can never sit under a selection they don't belong to.
function segInit(id, onPick) {
  $(id).querySelectorAll('button').forEach((b) => b.onclick = () => { onPick(b.dataset.v); syncSeg(); search(); });
}
function syncSeg() {   // the buttons always show the CURRENT when/kind (also after a saved answer is restored)
  $('segWhen').querySelectorAll('button').forEach((x) => x.classList.toggle('sel', x.dataset.v === when));
  $('segKind').querySelectorAll('button').forEach((x) => x.classList.toggle('sel', x.dataset.v === kind));
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
// Facilities: only what is actually KNOWN (yes or no), nothing when nothing is known.
function facLine(r) {
  const f = r.facilities || {};
  const known = [['powered', 'Powered'], ['showers', 'Showers'], ['toilets', 'Toilets'], ['pool', 'Pool'], ['wifi', 'Wi-fi']]
    .filter(([k]) => f[k] === 'yes' || f[k] === 'no').map(([k, l]) => `${l}: ${f[k]}`);
  if (r.price && r.price !== 'unknown' && r.price !== 'free') known.push(`Price: ${r.price}`);
  return known.join(' · ');
}
let searchSeq = 0;   // a later tap wins — an earlier, slower answer is dropped, never drawn over the new selection
async function search() {
  if (!trip) return show('s1');
  const tgt = target();
  const seq = ++searchSeq;
  $('results').innerHTML = '<p class="quiet">Searching…</p>'; $('stayNotice').innerHTML = ''; lastShown = null;   // old cards gone the moment a button is tapped
  $('pinRow').innerHTML = ''; if (mapLayer) { mapLayer.remove(); mapLayer = null; }                              // and the old pins with them
  if (view === 'map') { const m = $('mapMsg'); m.textContent = 'Searching…'; m.classList.add('on'); }
  const params = pos ? { lat: pos.lat, lng: pos.lng, dlat: tgt.lat, dlng: tgt.lng, when, kind } : null;
  const r = params ? await api('stay', params, 25000) : { ok: false, status: 0, data: null };
  if (seq !== searchSeq) return;   // superseded by a newer tap
  if (r.ok && r.data && Array.isArray(r.data.results)) {
    const kept = { when, kind };   // never the position — a ?at= test position must not be saved or reused
    const saved = { answer: r.data, target: tgt.name, ts: Date.now(), params: kept };
    store.set('nav2_last_stay', saved);
    round = { sites: r.data.results, calls: {}, target: tgt.name, params: kept, ts: Date.now() };
    store.set('nav2_round', round);
    renderStay(r.data, tgt.name, '');
    return;
  }
  // Failed: no signal (or the service) — show the last answer plainly labelled, if there is one.
  const last = store.get('nav2_last_stay', null);
  const why = !pos ? 'No GPS position yet.' : (!navigator.onLine || r.status === 0) ? 'No signal.' : 'The stay service is playing up — not your signal.';
  if (last && last.answer) {
    if (!round || !round.sites) { round = { sites: last.answer.results, calls: {}, target: last.target, params: last.params, ts: last.ts }; store.set('nav2_round', round); }
    renderStay(last.answer, last.target, `${why} Showing your last answer from ${timeLabel(last.ts)}.`);
  } else {
    $('results').innerHTML = `<p class="notice">${esc(why)} ${!pos ? 'Give it a moment.' : 'Try again when you have coverage.'}</p>`;
  }
}
// One compact row — used by the list AND by the map's tapped-pin row (MAP).
function buildRow(r, i, ans, short, calls) {
  const free = r.kind === 'free';
  const row = document.createElement('div'); row.className = 'rowi' + (free ? ' free' : '');
  const line2 = ans.when === 'stop'
    ? `${r.dist_from_stop_km} km from ${esc(short)} · ${esc(r.drive_time)} away`
    : `${r.km_ahead} km ahead · ${esc(r.drive_time)} · ${r.km_from_destination} km to ${esc(short)}`;
  const fac = facLine(r);
  row.innerHTML = `<div class="txt"><div class="nm">${i + 1}. ${esc(r.name)}${free ? '<span class="badge">FREE</span>' : ''}</div>
    <div class="ln2">${line2}</div>${fac ? `<div class="fac">${esc(fac)}</div>` : ''}
    ${calls[r.name] ? `<div class="called">Called at ${timeLabel(calls[r.name])}</div>` : ''}</div>`;
  row.onclick = () => takeMeThere(r.lat, r.lng);   // the ROW is the map handover
  if (r.phone) {
    const a = document.createElement('a'); a.className = 'btn ph'; a.href = 'tel:' + r.phone.replace(/[^\d+]/g, '');
    a.textContent = '📞'; a.setAttribute('aria-label', `Call ${r.name} on ${r.phone}`);
    a.onclick = (e) => { e.stopPropagation(); noteCalled(r.name); };
    row.appendChild(a);
  } else if (!free) {
    // No number yet. The first three were already looked up by the Worker (nothing found);
    // rows beyond that look up ON TAP — a paid lookup only when the driver actually wants it.
    const looked = i < 3 || r.phoneLookedUp;
    const b = document.createElement('button'); b.className = 'btn ph' + (looked ? ' off' : ''); b.textContent = '📞';
    b.setAttribute('aria-label', looked ? `No phone number found for ${r.name}` : `Look up the number for ${r.name}`);
    b.onclick = (e) => { e.stopPropagation(); if (!looked) lookupPhone(r, row, b); };
    row.appendChild(b);
    if (looked) { const n = document.createElement('div'); n.className = 'nonum'; n.textContent = 'No phone number found'; row.querySelector('.txt').appendChild(n); }
  }
  return row;
}
function renderStay(ans, tgtName, notice) {
  lastShown = { ans, tgtName, notice };
  $('pinRow').innerHTML = '';
  const box = $('results'); box.innerHTML = '';
  $('stayNotice').innerHTML = notice ? `<div class="notice">${esc(notice)}</div>` : '';
  if (ans.note) { const n = document.createElement('div'); n.className = 'notice'; n.textContent = cap(ans.note) + '.'; box.appendChild(n); }
  if (!ans.results || !ans.results.length) { const p = document.createElement('p'); p.className = 'card'; p.textContent = ans.message || 'Nothing found ahead.'; box.appendChild(p); return; }
  const calls = (round && round.calls) || {};
  const short = shortName({ name: tgtName });
  const list = document.createElement('div'); list.className = 'rows';
  ans.results.forEach((r, i) => list.appendChild(buildRow(r, i, ans, short, calls)));
  box.appendChild(list);
  if (view === 'map') drawMap(ans, tgtName);   // the map shows the SAME results — no search of its own
  // Only under a "Soon" list: widen to the one-hour mark. (The other modes have their own point.)
  if (ans.when === 'soon') {
    const b = document.createElement('button'); b.className = 'brown slim'; b.textContent = 'Search further (within 1 hr)';
    b.onclick = () => { when = '1'; syncSeg(); search(); };
    box.appendChild(b);
  }
}
// On-tap number lookup for rows 4–10 (Worker /stay-phone: Place Details, 500 m rule, cached).
// Found → the row keeps the number (saved with the round) and the phone dials; not found →
// "No phone number found" under the row and the button greys out.
async function lookupPhone(r, row, btn) {
  if (!r.id) { r.phoneLookedUp = true; onReturn(); return; }
  btn.textContent = '…'; btn.disabled = true;
  const res = await api('stay-phone', { id: r.id, lat: r.lat, lng: r.lng }, 12000);
  const phone = res.ok && res.data && res.data.phone;
  r.phoneLookedUp = true;
  if (phone) { r.phone = phone; noteCalled(r.name); }
  // Persist onto the saved round/answer so a reopen shows the same state.
  const site = round && round.sites && round.sites.find((s) => s.name === r.name); if (site) { site.phone = r.phone || null; site.phoneLookedUp = true; store.set('nav2_round', round); }
  const last = store.get('nav2_last_stay', null); if (last && last.answer && last.answer.results) { const ls = last.answer.results.find((s) => s.name === r.name); if (ls) { ls.phone = r.phone || null; ls.phoneLookedUp = true; store.set('nav2_last_stay', last); } }
  onReturn();   // re-draw the same list, no search
  if (phone) window.location.href = 'tel:' + phone.replace(/[^\d+]/g, '');
}
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

// ── Calls: remember WHEN each park was rung; on return the same list re-draws with a
// "Called at" line on that card. No question asked, no new search — the driver knows the
// outcome and simply rings the next one.
function noteCalled(name) { if (!round) return; round.calls = round.calls || {}; round.calls[name] = Date.now(); store.set('nav2_round', round); }
function onReturn() { if (lastShown && document.querySelector('#s3.on')) renderStay(lastShown.ans, lastShown.tgtName, lastShown.notice); }

// ── MAP (Stay screen) — Leaflet 1.9.4 + OpenStreetMap tiles, loaded only when the driver
// first taps "Map", so the List never depends on it. Names go into the map as TEXT NODES
// only (tooltips via setContent(element)), pin labels are digits; nothing is inserted as HTML.
let view = 'list';
const LEAFLET_VER = '1.9.4';
const LEAFLET = {
  js:  { url: `https://unpkg.com/leaflet@${LEAFLET_VER}/dist/leaflet.js`,  sri: 'sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH' },
  css: { url: `https://unpkg.com/leaflet@${LEAFLET_VER}/dist/leaflet.css`, sri: 'sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H' },
};
let leafletLoad = null;
function ensureLeaflet() {
  if (window.L && window.L.map) return Promise.resolve();
  if (leafletLoad) return leafletLoad;
  const blocked = new URLSearchParams(location.search).get('nomap') === '1';   // test hook: behave as if the library can't load
  leafletLoad = new Promise((resolve, reject) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = blocked ? '/blocked/leaflet.css' : LEAFLET.css.url; css.integrity = LEAFLET.css.sri; css.crossOrigin = 'anonymous';
    document.head.appendChild(css);
    const s = document.createElement('script'); s.src = blocked ? '/blocked/leaflet.js' : LEAFLET.js.url; s.integrity = LEAFLET.js.sri; s.crossOrigin = 'anonymous';
    const timer = setTimeout(() => reject(new Error('timeout')), 12000);
    s.onload = () => { clearTimeout(timer); (window.L && window.L.map) ? resolve() : reject(new Error('no L')); };
    s.onerror = () => { clearTimeout(timer); reject(new Error('load failed')); };
    document.head.appendChild(s);
  }).catch((e) => { leafletLoad = null; throw e; });
  return leafletLoad;
}
function setView(v) {
  view = v === 'map' ? 'map' : 'list';
  $('segView').querySelectorAll('button').forEach((x) => x.classList.toggle('sel', x.dataset.v === view));
  $('s3').classList.toggle('mapmode', view === 'map');
  $('pinRow').innerHTML = '';
  if (view === 'map' && lastShown) drawMap(lastShown.ans, lastShown.tgtName);
}
const routeLines = {};   // target name → [[lat,lng],…] from /route (the Worker samples it to ≤500 points)
let mapObj = null, mapLayer = null;
async function drawMap(ans, tgtName) {
  const msg = $('mapMsg'); msg.textContent = ''; msg.classList.remove('on');
  try { await ensureLeaflet(); }
  catch (e) { msg.textContent = 'Map not available right now'; msg.classList.add('on'); return; }
  if (view !== 'map') return;
  const tgt = target(); if (!tgt) return;
  // The route line (fetched once per target; openMain usually has it already).
  if (!routeLines[tgt.name] && pos) {
    const r = await api('route', { lat: pos.lat, lng: pos.lng, dlat: tgt.lat, dlng: tgt.lng }, 12000);
    if (r.ok && r.data && Array.isArray(r.data.line)) routeLines[tgt.name] = r.data.line;
    if (view !== 'map') return;
  }
  if (!mapObj) {
    mapObj = L.map('map', { zoomControl: true, attributionControl: true, scrollWheelZoom: false });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(mapObj);
  }
  if (mapLayer) { mapLayer.remove(); }
  mapLayer = L.layerGroup().addTo(mapObj);
  const pts = [];
  const line = routeLines[tgt.name];
  if (line && line.length > 1) L.polyline(line, { color: '#1E6B47', weight: 4, opacity: 0.8 }).addTo(mapLayer);
  if (pos) { L.marker([pos.lat, pos.lng], { icon: L.divIcon({ className: '', html: '<div class="pin here"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), interactive: false }).addTo(mapLayer); if (ans.when !== 'stop') pts.push([pos.lat, pos.lng]); }
  // Destination / stop: a square marker with its name as a text-node tooltip.
  const dm = L.marker([tgt.lat, tgt.lng], { icon: L.divIcon({ className: '', html: '<div class="pin dest"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), interactive: false }).addTo(mapLayer);
  const nameEl = document.createElement('span'); nameEl.textContent = shortName(tgt);
  dm.bindTooltip(L.tooltip({ permanent: true, direction: 'right', offset: [8, 0], className: 'dest-name' }).setContent(nameEl));
  if (ans.when === 'stop') pts.push([tgt.lat, tgt.lng]);   // fit: position + pins (soon/1/2), or the stop + its pins (At); the route line may run off the edge
  const short = shortName({ name: tgtName }), calls = (round && round.calls) || {};
  (ans.results || []).forEach((r, i) => {
    if (r.lat == null || r.lng == null) return;
    const m = L.marker([r.lat, r.lng], { icon: L.divIcon({ className: '', html: `<div class="pin ${r.kind === 'free' ? 'free' : 'park'}">${i + 1}</div>`, iconSize: [28, 28], iconAnchor: [14, 14] }) }).addTo(mapLayer);
    m.on('click', () => { const pr = $('pinRow'); pr.innerHTML = ''; pr.appendChild(buildRow(r, i, ans, short, calls)); });
    pts.push([r.lat, r.lng]);
  });
  setTimeout(() => { mapObj.invalidateSize(); if (pts.length) mapObj.fitBounds(pts, { padding: [24, 24], maxZoom: 14 }); }, 50);
}

// ── Wiring ─────────────────────────────────────────────────────────────────────
$('goBtn').onclick = onGo;
$('dest').addEventListener('keydown', (e) => { if (e.key === 'Enter') onGo(); });
$('stop').addEventListener('keydown', (e) => { if (e.key === 'Enter') onGo(); });
// New trip: screen 1 with EMPTY boxes and the recent trips listed (the current trip stays saved until a new one is confirmed).
$('newTripBtn').onclick = () => { $('dest').value = ''; $('stop').value = ''; showEntry(); renderRecent(); show('s1'); };
$('stayBtn').onclick = () => {
  show('s3'); labelAtStop();
  const last = store.get('nav2_last_stay', null);
  if (round && round.sites && round.sites.length && last && last.target === round.target) {
    // Show the saved answer — and set the buttons to what it was searched with, so they never disagree.
    if (last.answer && last.answer.when) when = last.answer.when;
    if (last.params && last.params.kind) kind = last.params.kind;
    syncSeg();
    renderStay(last.answer, round.target, `Showing your answer from ${timeLabel(last.ts)}. Tap a button to search again.`);
  } else { syncSeg(); search(); }
};
$('backBtn').onclick = openMain;
segInit('segWhen', (v) => { when = v; });
segInit('segKind', (v) => { kind = v; });
// List | Map: a VIEW switch only — never a search. Both show the same results.
$('segView').querySelectorAll('button').forEach((b) => b.onclick = () => { setView(b.dataset.v); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') onReturn(); });
window.addEventListener('pageshow', onReturn);
$('stamp').textContent = BUILD;

// ── Boot ───────────────────────────────────────────────────────────────────────
(async function boot() {
  renderRecent();
  if (trip) openMain(); else show('s1');
  initPosition(false);                            // a ?at= fix lands synchronously; a real fix redraws the main screen via onFix() when it arrives
  // Reopened with a saved answer and no signal → show it, plainly labelled.
  if (trip && !navigator.onLine && document.querySelector('#s2.on')) {
    const last = store.get('nav2_last_stay', null);
    if (last && last.answer) { show('s3'); renderStay(last.answer, last.target, `No signal. Showing your last answer from ${timeLabel(last.ts)}.`); }
  }
})();
</script>
</body>
</html>
